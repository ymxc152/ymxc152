name: Generate contribution snake

on:
  schedule:
    - cron: "18 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake assets
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ymxc152
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6673e8&color_dots=#eef2f7,#dcecff,#b9dcff,#8da8f2,#6673e8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8b97ff&color_dots=#161b22,#22304f,#354d85,#596fc5,#8b97ff

      - name: Publish assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
