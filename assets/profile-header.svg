  <text x="91" y="55" fill="url(#accent)" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="34" font-weight="760">雨墨星辰</text>
  <text x="31" y="88" fill="#17213a" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="16">不爱编程，但很爱让程序与 Agent 替我干活。</text>
  <text x="31" y="109" fill="#66738d" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-style="italic">I don’t love coding, but I love making software and Agents work for me.</text>
