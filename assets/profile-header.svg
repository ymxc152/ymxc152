  <rect x="1" y="1" width="898" height="124" rx="14" fill="url(#panel)" stroke="#d9e2f2"/>
  <g fill="none" stroke="#8b98d8" opacity=".35"><ellipse cx="811" cy="61" rx="58" ry="19" transform="rotate(-12 811 61)"/><ellipse cx="811" cy="61" rx="35" ry="10" transform="rotate(-12 811 61)"/></g><circle cx="766" cy="49" r="3" fill="#d99a35"/><circle cx="854" cy="72" r="2.5" fill="#42aabd"/>
