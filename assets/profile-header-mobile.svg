<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc"><title id="title">雨墨星辰</title><desc id="desc">不爱编程，但很爱让程序与 Agent 替我干活。</desc><defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f8ff"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#398eb8"/><stop offset=".5" stop-color="#6673e8"/><stop offset="1" stop-color="#8a69d9"/></linearGradient></defs><rect x="2" y="2" width="596" height="186" rx="20" fill="url(#p)" stroke="#d9e2f2" stroke-width="2"/><path d="M35 45c12-21 35-27 53-16-17 6-26 18-26 35 0 16 8 28 23 36-22 6-43-5-51-24-5-11-4-21 1-31Z" fill="none" stroke="#6673e8" stroke-width="5"/><path d="m82 31 6 12 14 2-10 9 3 14-13-7-13 7 4-14-11-9 14-2Z" fill="#d99a35"/><text x="120" y="78" fill="url(#a)" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="49" font-weight="760">雨墨星辰</text><text x="34" y="128" fill="#17213a" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="25">不爱编程，但很爱让程序与 Agent 替我干活。</text><text x="34" y="162" fill="#66738d" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-style="italic">Making software and Agents work for me.</text></svg>
