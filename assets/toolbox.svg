      <path d="M4 7h10v6H4zM6 5h6" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="24" y="8" fill="#253149" font-size="13" font-weight="680">运行环境</text>
      <text x="24" y="27" fill="#66738d" font-size="11">Linux · Docker</text>
    </g>
    <line x1="447" y1="70" x2="447" y2="113" stroke="#e3e9f4"/>
    <g transform="translate(475 70)">
      <circle cx="9" cy="9" r="8" fill="#e5644b"/>
