      <path d="M5 9h8M9 5v8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="8" fill="#253149" font-size="13" font-weight="680">自动化</text>
      <text x="24" y="27" fill="#66738d" font-size="11">Python · Shell</text>
    </g>
    <line x1="222" y1="70" x2="222" y2="113" stroke="#e3e9f4"/>
    <g transform="translate(250 70)">
