<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-labelledby="title desc">
  <title id="title">常用工具箱</title>
  <desc id="desc">自动化、运行环境、数据与工作流、Agent 探索</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="130" rx="14" fill="url(#panel)" stroke="#d9e2f2"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <rect x="25" y="16" width="28" height="28" rx="7" fill="#eef2ff" stroke="#6673e8"/>
    <path d="M32 24h14M32 30h9M32 36h12" fill="none" stroke="#6673e8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="66" y="37" fill="#17213a" font-size="19" font-weight="720">常用工具箱</text>
    <text x="185" y="36" fill="#7a869e" font-size="11">按用途分组，方便继续扩展</text>
    <line x1="25" y1="56" x2="875" y2="56" stroke="#e0e7f3"/>

    <g transform="translate(25 70)">
